<svg viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#444"/>
    </marker>
  </defs>
  <rect width="900" height="330" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2328">RSSD framework: shadow removal on hand images</text>

  <rect x="25" y="120" width="120" height="70" rx="8" fill="#f1f3f5" stroke="#555"/>
  <text x="85" y="150" text-anchor="middle" font-size="14" fill="#1f2328">Input:</text>
  <text x="85" y="170" text-anchor="middle" font-size="14" fill="#1f2328">hand image</text>
  <text x="85" y="186" text-anchor="middle" font-size="12" fill="#1f2328">with shadows</text>

  <rect x="205" y="55" width="170" height="70" rx="8" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="290" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2328">1. Hand extraction</text>
  <text x="290" y="102" text-anchor="middle" font-size="12" fill="#1f2328">HSV-YCbCr thresholding</text>
  <text x="290" y="117" text-anchor="middle" font-size="12" fill="#1f2328">+ dilation (9x9 kernel)</text>

  <rect x="205" y="185" width="170" height="85" rx="8" fill="#fff4e6" stroke="#e8590c"/>
  <text x="290" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2328">2. Shadow detection</text>
  <text x="290" y="232" text-anchor="middle" font-size="12" fill="#1f2328">ST-CGAN (U-Net + PatchGAN)</text>
  <text x="290" y="247" text-anchor="middle" font-size="12" fill="#1f2328">+ hand mask input</text>

  <rect x="465" y="185" width="170" height="85" rx="8" fill="#ebfbee" stroke="#2f9e44"/>
  <text x="550" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2328">3. Shadow removal</text>
  <text x="550" y="232" text-anchor="middle" font-size="12" fill="#1f2328">SP+M Net (SP Net + M Net)</text>
  <text x="550" y="247" text-anchor="middle" font-size="12" fill="#1f2328">+ hand mask input</text>

  <rect x="725" y="200" width="150" height="55" rx="8" fill="#f1f3f5" stroke="#555"/>
  <text x="800" y="224" text-anchor="middle" font-size="14" fill="#1f2328">Output:</text>
  <text x="800" y="242" text-anchor="middle" font-size="14" fill="#1f2328">shadow-free image</text>

  <path d="M145 145 L205 100" stroke="#444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M145 170 L205 215" stroke="#444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M290 125 L290 185" stroke="#444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="298" y="160" font-size="11" fill="#1f2328">hand mask</text>
  <path d="M375 228 L465 228" stroke="#444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="420" y="219" text-anchor="middle" font-size="11" fill="#1f2328">shadow mask</text>
  <path d="M375 90 L550 90 L550 185" stroke="#444" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="560" y="140" font-size="11" fill="#1f2328">hand mask</text>
  <path d="M635 228 L725 228" stroke="#444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M85 190 L85 300 L550 300 L550 270" stroke="#444" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="300" y="316" text-anchor="middle" font-size="11" fill="#1f2328">original shadow image</text>
</svg>
