<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#444"/>
    </marker>
  </defs>
  <rect width="900" height="300" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2328">Synthetic dataset generation (repeated every training loop)</text>

  <rect x="20" y="55" width="150" height="50" rx="8" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="95" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Background</text>
  <text x="95" y="93" text-anchor="middle" font-size="11" fill="#1f2328">GTEA (36,500)</text>

  <rect x="20" y="125" width="150" height="50" rx="8" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="95" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Hand image</text>
  <text x="95" y="163" text-anchor="middle" font-size="11" fill="#1f2328">11K Hands + NTUST-IP</text>

  <rect x="20" y="195" width="150" height="50" rx="8" fill="#fff4e6" stroke="#e8590c"/>
  <text x="95" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Random shadow mask</text>
  <text x="95" y="233" text-anchor="middle" font-size="11" fill="#1f2328">Bezier, 7 control points</text>

  <rect x="230" y="100" width="150" height="100" rx="8" fill="#f1f3f5" stroke="#555"/>
  <text x="305" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Pre-processing</text>
  <text x="305" y="147" text-anchor="middle" font-size="11" fill="#1f2328">scale + rotate</text>
  <text x="305" y="163" text-anchor="middle" font-size="11" fill="#1f2328">extract hand mask</text>
  <text x="305" y="179" text-anchor="middle" font-size="11" fill="#1f2328">blur shadow mask</text>

  <rect x="440" y="100" width="150" height="100" rx="8" fill="#fff9db" stroke="#f08c00"/>
  <text x="515" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Mask validation</text>
  <text x="515" y="147" text-anchor="middle" font-size="11" fill="#1f2328">combine hand + shadow</text>
  <text x="515" y="163" text-anchor="middle" font-size="11" fill="#1f2328">keep if shadow covers</text>
  <text x="515" y="179" text-anchor="middle" font-size="11" fill="#1f2328">10%-90% of hand region</text>

  <rect x="650" y="100" width="230" height="100" rx="8" fill="#ebfbee" stroke="#2f9e44"/>
  <text x="765" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Composite training sample</text>
  <text x="765" y="147" text-anchor="middle" font-size="11" fill="#1f2328">shadow-full image</text>
  <text x="765" y="163" text-anchor="middle" font-size="11" fill="#1f2328">shadow-free ground truth</text>
  <text x="765" y="179" text-anchor="middle" font-size="11" fill="#1f2328">shadow mask + hand mask</text>

  <path d="M170 80 L200 80 L200 140 L230 140" stroke="#444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M170 150 L230 150" stroke="#444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M170 220 L200 220 L200 160 L230 160" stroke="#444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M380 150 L440 150" stroke="#444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M590 150 L650 150" stroke="#444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M515 200 L515 265 L305 265 L305 205" stroke="#444" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="410" y="282" text-anchor="middle" font-size="11" fill="#1f2328">mask outside range is not used</text>
</svg>
